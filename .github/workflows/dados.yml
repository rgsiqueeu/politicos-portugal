name: Atualizar dados

on:
  schedule:
    - cron: "17 5 * * *" # todos os dias, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dados
      - name: Gravar se houver alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gerado
          # meta.json muda sempre (data da recolha); só grava se os dados mudaram
          if git diff --cached --quiet -- data/gerado ':!data/gerado/meta.json'; then
            echo "Sem alterações."
          else
            git commit -m "Dados: atualização de $(date -u +%Y-%m-%d)"
            git push
          fi
